[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lupin"
version = "0.1.0"
description = "Multi-machine loop coordination: model routing and slot leases"
license = "FSL-1.1-MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["redis"]

[project.scripts]
lupin = "lupin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lupin = ["model-tiers.json", "benchmark-data.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
